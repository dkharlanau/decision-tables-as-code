name: Publish Product Page

on:
  push:
    branches: [main]
    paths: ["docs/product.html", "docs/agent-manifest.json", ".github/workflows/product-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Stage product site
        run: |
          mkdir -p _site
          cp docs/product.html _site/index.html
          cp docs/agent-manifest.json _site/agent-manifest.json
          touch _site/.nojekyll
      - name: Detect Pages availability
        id: pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not enabled for this repository. The product site build is valid, but deployment is skipped. Enable Settings > Pages > Source: GitHub Actions to publish it."
          fi
      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Add consent-aware portfolio analytics
        run: node scripts/inject-portfolio-analytics.mjs _site
      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
