name: fix-policy-warning-text

on:
  push:
    branches: [agent/fix-policy-warning-text]
    paths:
      - .github/workflows/fix-policy-warning-text.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-policy-warning-text
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply CLI fix and regression tests
        run: |
          python - <<'PY'
          from pathlib import Path

          cli = Path('decision_tables_as_code/cli.py')
          text = cli.read_text(encoding='utf-8')
          old = '''    if output_format == "json":\n        rendered = json.dumps(report, indent=2, sort_keys=True, ensure_ascii=False, default=str) + "\\n"\n    elif report["ok"]:\n        rendered = f"OK {table.id}: policies {', '.join(report['policy_ids'])} passed\\n"\n    else:\n        lines: list[str] = []\n        for item in report["base_validation"]:\n            lines.append(f"{item['severity'].upper():7} {item['code']} {item['path']}: {item['message']}\\n")\n        for item in report["policy_diagnostics"]:\n            lines.append(\n                f"{item['severity'].upper():7} {item['code']} [{item['policy_id']}] {item['path']}: {item['message']}\\n"\n            )\n        rendered = "".join(lines)\n'''
          new = '''    if output_format == "json":\n        rendered = json.dumps(report, indent=2, sort_keys=True, ensure_ascii=False, default=str) + "\\n"\n    elif report["base_validation"] or report["policy_diagnostics"]:\n        lines: list[str] = []\n        for item in report["base_validation"]:\n            lines.append(f"{item['severity'].upper():7} {item['code']} {item['path']}: {item['message']}\\n")\n        for item in report["policy_diagnostics"]:\n            lines.append(\n                f"{item['severity'].upper():7} {item['code']} [{item['policy_id']}] {item['path']}: {item['message']}\\n"\n            )\n        rendered = "".join(lines)\n    else:\n        rendered = f"OK {table.id}: policies {', '.join(report['policy_ids'])} passed\\n"\n'''
          if old not in text:
              raise SystemExit('expected policy-check rendering block not found')
          cli.write_text(text.replace(old, new), encoding='utf-8')

          tests = Path('tests/test_cli_reporting.py')
          body = tests.read_text(encoding='utf-8')
          addition = r'''


def test_policy_check_text_shows_warning_findings_without_failing(tmp_path, capsys):
    table = tmp_path / "table.yaml"
    table.write_text(
        """version: 1
id: warning-table
hit_policy: unique
inputs:
  - name: country
    type: string
outputs:
  - name: route
    type: string
rules:
  - id: de
    when: {country: DE}
    then: {route: eu}
""",
        encoding="utf-8",
    )
    policy = tmp_path / "warning-policy.yaml"
    policy.write_text(
        """version: 1
id: provenance-warning
severity: warning
rules:
  required_rule_fields: [owner]
""",
        encoding="utf-8",
    )

    exit_code = main(["policy-check", str(table), "--policy", str(policy)])
    rendered = capsys.readouterr().out

    assert exit_code == 0
    assert "WARNING" in rendered
    assert "POL004" in rendered
    assert "[provenance-warning]" in rendered
    assert "rules[0].owner" in rendered
    assert not rendered.startswith("OK ")


def test_policy_check_text_keeps_ok_for_zero_findings(tmp_path, capsys):
    table = tmp_path / "table.yaml"
    table.write_text(
        """version: 1
id: clean-table
hit_policy: unique
inputs:
  - name: country
    type: string
outputs:
  - name: route
    type: string
rules:
  - id: de
    when: {country: DE}
    then: {route: eu}
""",
        encoding="utf-8",
    )
    policy = tmp_path / "clean-policy.yaml"
    policy.write_text(
        """version: 1
id: simple-policy
severity: warning
rules:
  max_rules: 10
""",
        encoding="utf-8",
    )

    exit_code = main(["policy-check", str(table), "--policy", str(policy)])
    rendered = capsys.readouterr().out

    assert exit_code == 0
    assert rendered == "OK clean-table: policies simple-policy passed\n"
'''
          if 'test_policy_check_text_shows_warning_findings_without_failing' in body:
              raise SystemExit('regression tests already present')
          tests.write_text(body + addition, encoding='utf-8')
          PY
      - name: Run focused tests
        run: python -m pytest -q tests/test_cli_reporting.py
      - name: Run full suite
        run: python -m pytest -q
      - name: Commit verified change
        run: |
          rm .github/workflows/fix-policy-warning-text.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: show warning-only policy findings in text output'
          git push origin HEAD:agent/fix-policy-warning-text
