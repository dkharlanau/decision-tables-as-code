name: fix-policy-warning-text

on:
  push:
    branches:
      - agent/fix-policy-warning-text

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-policy-warning-text
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply fix
        run: python scripts/apply_policy_warning_text_fix.py
      - name: Run focused tests
        run: python -m pytest -q tests/test_cli_reporting.py
      - name: Run full suite
        run: python -m pytest -q
      - name: Commit verified change
        run: |
          rm .github/workflows/fix-policy-warning-text.yml
          rm scripts/apply_policy_warning_text_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: show warning-only policy findings in text output"
          git push origin HEAD:agent/fix-policy-warning-text
