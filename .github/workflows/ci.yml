name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - run: python scripts/generate_cli_reference.py --check
      - run: dtac validate examples/order-routing.yaml
      - run: dtac validate examples/order-routing.yaml --format github
      - run: dtac validate examples/order-routing.yaml --format sarif --output /tmp/dtac.sarif
      - run: python -c 'import json; d=json.load(open("/tmp/dtac.sarif")); assert d["version"] == "2.1.0"'
      - run: dtac inspect examples/order-routing.yaml --output /tmp/inspect.json
      - run: python -c 'import json; d=json.load(open("/tmp/inspect.json")); assert d["format_version"] == 1 and d["table"]["id"] == "order-routing"'
      - run: dtac diff examples/order-routing.yaml examples/order-routing-v2.yaml --fail-on never --output /tmp/diff.json
      - run: python -c 'import json; d=json.load(open("/tmp/diff.json")); assert d["format_version"] == 1 and d["changed"] and d["classification"] in {"potentially_breaking", "breaking"}'
      - run: dtac coverage examples/order-routing.yaml
      - run: dtac import examples/order-routing.csv --config examples/order-routing.import.yaml --output /tmp/imported.yaml
      - run: dtac validate /tmp/imported.yaml
      - run: dtac coverage /tmp/imported.yaml
      - run: dtac test examples/order-routing.yaml examples/order-routing.scenarios.yaml
      - run: dtac test examples/effective-routing.yaml examples/effective-routing.scenarios.yaml
      - name: Verify dependency-free JavaScript export
        run: |
          dtac js-export examples/order-routing.yaml --output /tmp/order-routing.mjs --types-output /tmp/order-routing.d.ts
          grep -q "export function evaluate" /tmp/order-routing.mjs
          grep -q "export interface DecisionResult" /tmp/order-routing.d.ts
          node --input-type=module -e 'import("file:///tmp/order-routing.mjs").then(({evaluate}) => { const d=evaluate({country:"DE",customer_type:"B2B",order_value:6000}); if (JSON.stringify(d.matched_rule_ids)!==JSON.stringify(["de-b2b-high"])) process.exit(1); if (d.outputs.route!=="enterprise-desk" || d.outputs.approval!=="senior") process.exit(1); })'
          dtac js-export examples/effective-routing.yaml --output /tmp/effective-routing.mjs
          node --input-type=module -e 'import("file:///tmp/effective-routing.mjs").then(({evaluate}) => { const d=evaluate({country:"DE"},{asOf:"2027-01-01"}); if (JSON.stringify(d.matched_rule_ids)!==JSON.stringify(["de-new"]) || d.outputs.route!=="eu-new") process.exit(1); })'
      - name: Verify decision package execution and impact
        run: |
          dtac package-validate examples/package/order-approval/package.yaml
          dtac package-eval examples/package/order-approval/package.yaml --facts '{"customer_tier":"VIP","blocked":false,"amount":500,"region":"EU"}' --output /tmp/package-result.json
          python -c 'import json; d=json.load(open("/tmp/package-result.json")); assert d["order"] == ["risk-classification","approval-decision","fulfillment-route"] and d["terminal_outputs"] == {"fulfillment-route":{"queue":"EU_AUTO"}}'
          dtac package-graph examples/package/order-approval/package.yaml --format json --output /tmp/package-graph.json
          python -c 'import json; d=json.load(open("/tmp/package-graph.json")); assert len(d["nodes"]) == 3 and len(d["edges"]) == 2'
          dtac package-graph examples/package/order-approval/package.yaml --format mermaid --output /tmp/package-graph.mmd
          grep -q "flowchart LR" /tmp/package-graph.mmd
          dtac package-impact examples/package/order-approval/package.yaml --changed risk-classification --output /tmp/package-impact.json
          python -c 'import json; d=json.load(open("/tmp/package-impact.json")); assert d["downstream_impacted"] == ["approval-decision","fulfillment-route"]'
      - name: Verify package semantic diff reports transitive impact
        run: |
          cp -R examples/package/order-approval /tmp/order-approval-candidate
          python - <<'PY'
          from pathlib import Path
          import yaml
          path = Path('/tmp/order-approval-candidate/risk-classification.yaml')
          data = yaml.safe_load(path.read_text())
          for rule in data['rules']:
              if rule['id'] == 'vip':
                  rule['then']['risk_level'] = 'MEDIUM'
          path.write_text(yaml.safe_dump(data, sort_keys=False), encoding='utf-8')
          PY
          dtac package-diff examples/package/order-approval/package.yaml /tmp/order-approval-candidate/package.yaml --fail-on never --output /tmp/package-diff.json
          python -c 'import json; d=json.load(open("/tmp/package-diff.json")); assert d["semantic_changed_tables"] == ["risk-classification"] and d["downstream_impacted"] == ["approval-decision","fulfillment-route"] and d["all_affected"] == ["risk-classification","approval-decision","fulfillment-route"]'
      - name: Verify DMN 1.4 UNIQUE round trip
        run: |
          dtac dmn-import examples/dmn/routing-unique.dmn --output /tmp/dmn-routing.yaml
          dtac validate /tmp/dmn-routing.yaml
          dtac dmn-export /tmp/dmn-routing.yaml --output /tmp/dmn-routing-roundtrip.dmn
          dtac dmn-import /tmp/dmn-routing-roundtrip.dmn --output /tmp/dmn-routing-roundtrip.yaml
          dtac diff /tmp/dmn-routing.yaml /tmp/dmn-routing-roundtrip.yaml
      - name: Verify DMN 1.4 FIRST round trip
        run: |
          dtac dmn-import examples/dmn/approval-first.dmn --output /tmp/dmn-first.yaml
          dtac validate /tmp/dmn-first.yaml
          dtac dmn-export /tmp/dmn-first.yaml --output /tmp/dmn-first-roundtrip.dmn
          dtac dmn-import /tmp/dmn-first-roundtrip.dmn --output /tmp/dmn-first-roundtrip.yaml
          dtac diff /tmp/dmn-first.yaml /tmp/dmn-first-roundtrip.yaml
          dtac eval /tmp/dmn-first-roundtrip.yaml --facts '{"amount":15000}' > /tmp/dmn-first-result.json
          python -c 'import json; d=json.load(open("/tmp/dmn-first-result.json")); assert d["matched_rule_ids"] == ["large"] and d["outputs"] == {"strategy":"L3"}'
      - name: Validate and execute SAP examples
        run: |
          for name in customer-account-group-derivation tax-classification interface-replication-filter approval-matrix; do
            dtac validate "examples/sap/${name}.yaml"
            dtac test "examples/sap/${name}.yaml" "examples/sap/${name}.scenarios.yaml"
          done
      - run: dtac render examples/order-routing.yaml --format html --coverage --output /tmp/order-routing.html
      - run: dtac render examples/order-routing-v2.yaml --format markdown --against examples/order-routing.yaml --output /tmp/order-routing-diff.md
      - run: dtac render examples/effective-routing.yaml --format html --output /tmp/effective-routing.html
      - run: python -c 't=open("/tmp/effective-routing.html", encoding="utf-8").read(); assert "Rule governance" in t and "CHG-1042" in t and "2027-01-01" in t'
