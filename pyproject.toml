[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-tables-as-code"
version = "0.1.0"
description = "Git-native validation, evaluation, coverage, and semantic diff for enterprise decision tables."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Dzmitryi Kharlanau"}]
keywords = ["decision-tables", "business-rules", "rules-engine", "dmn", "sap", "gitops"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = ["PyYAML>=6.0"]

[project.urls]
Documentation = "https://dkharlanau.github.io/decision-tables-as-code/"
Repository = "https://github.com/dkharlanau/decision-tables-as-code"
Issues = "https://github.com/dkharlanau/decision-tables-as-code/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "openpyxl>=3.1"]
excel = ["openpyxl>=3.1"]

[project.scripts]
dtac = "decision_tables_as_code.cli:main"
dtac-python-export = "decision_tables_as_code.runtime_cli:main"

[tool.setuptools.packages.find]
include = ["decision_tables_as_code*"]
exclude = ["docs*", "examples*", "schema*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
